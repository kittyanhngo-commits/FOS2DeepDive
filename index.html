<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered dive column; a depth strip on top darkens the water as points accrue. Single deliberate deep-sea look. */
:root{
  color-scheme: dark;
  --water-0:#0f3b52;      /* surface */
  --water-1:#071827;      /* abyss */
  --ink:#e6f1f4;
  --ink-dim:#93b1bd;
  --line:#1f4a5e;
  --panel:#0b2536cc;
  --krill:#ff8c72;        /* accent: krill pink-orange */
  --krill-glow:#ff8c7255;
  --ok:#7fe0c3;
  --bad:#ff6b7d;
  --t-p:#9fb7a6; --t-c:#b4aed0; --t-s:#7cc4f0; --t-r:#4fe0c7; --t-d:#b48cff; --t-k:#ff8c72;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --depth:0;
}
html,body{min-height:100%}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, color-mix(in oklab, var(--water-0) calc(100% - var(--depth)*100%), var(--water-1)) 0%, transparent 70%),
    linear-gradient(180deg, color-mix(in oklab, var(--water-0) calc(70% - var(--depth)*70%), var(--water-1)) 0%, var(--water-1) 100%);
  background-color:var(--water-1);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.5;
  transition:background .8s ease;
}
body::after{ /* marine snow */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 20%, #cfe9f0 50%, transparent 51%),
    radial-gradient(1px 1px at 70% 35%, #cfe9f0 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 40% 70%, #cfe9f0 50%, transparent 51%),
    radial-gradient(1px 1px at 85% 80%, #cfe9f0 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 25% 90%, #cfe9f0 50%, transparent 51%);
  background-size:320px 420px;
  animation:snow 40s linear infinite;
}
@keyframes snow{to{background-position:0 420px}}
@media (prefers-reduced-motion: reduce){body::after{animation:none} *{transition:none!important;animation:none!important}}

.wrap{
  position:relative;z-index:1;max-width:720px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px 48px;
  display:flex;flex-direction:column;gap:20px;
}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(40px,9vw,64px);line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand h1 em{font-style:normal;color:var(--krill);text-shadow:0 0 24px var(--krill-glow)}
.gauge{text-align:right;font-family:var(--f-display);line-height:1}
.gauge .m{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.gauge .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}

.strip{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.strip > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t-s),var(--t-d),var(--krill));transition:width .8s ease}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;backdrop-filter:blur(6px)}
h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-dim)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 18px;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--krill);outline-offset:2px}
button.primary{background:var(--krill);border-color:var(--krill);color:#1a0d09}
button.primary:hover{filter:brightness(1.08)}
button.ghost:hover{border-color:var(--ink-dim)}
button[disabled]{opacity:.45;cursor:not-allowed}

.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tier{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.tier b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.tier span{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim)}
.c-p{color:var(--t-p)} .c-c{color:var(--t-c)} .c-s{color:var(--t-s)} .c-r{color:var(--t-r)} .c-d{color:var(--t-d)} .c-k{color:var(--t-k)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;font-weight:400;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--water-1);border-color:var(--ink)}

/* round */
.roundhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.05;text-transform:uppercase;text-wrap:balance;margin:6px 0 2px}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer > i{display:block;height:100%;background:var(--ok);width:100%;transform-origin:left}
.timer.low > i{background:var(--bad)}
.secs{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-dim)}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px 14px;border-radius:10px;border:1px solid var(--line);background:#04121ccc;color:var(--ink)}
.feedback{min-height:24px;font-size:15px}
.feedback.bad{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.result{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.badge{font-family:var(--f-display);font-weight:900;font-size:26px;text-transform:uppercase;padding:6px 14px;border-radius:10px;border:2px solid currentColor}
.badge.k{box-shadow:0 0 28px var(--krill-glow)}
.pts{font-family:var(--f-mono);font-size:15px}
.reveal{display:flex;flex-direction:column;gap:10px}
.reveal .grp{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:baseline;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:520px){.reveal .grp{grid-template-columns:1fr;gap:4px}}
.reveal .grp h4{margin:0;font-family:var(--f-display);font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.reveal .grp h4 small{font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);margin-left:6px}
.reveal .names{font-size:14px;color:var(--ink-dim)}
.reveal .names mark{background:var(--krill);color:#1a0d09;border-radius:4px;padding:0 4px;font-weight:700}

/* summary */
.big{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,14vw,96px);line-height:.9;font-variant-numeric:tabular-nums}
.band{font-family:var(--f-display);font-size:24px;text-transform:uppercase;color:var(--krill);letter-spacing:.03em}
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
table.sum td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sharebox{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;background:#04121ccc;border:1px solid var(--line);border-radius:10px;padding:12px;user-select:all}
footer{font-size:12px;color:var(--ink-dim);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

/* ---------- normalization + matching ---------- */
const ROMAN = {i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10,xi:11,xii:12,xiii:13};
function norm(s){
  s = (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  s = s.replace(/α/g,"alpha").replace(/β/g,"beta").replace(/γ/g,"gamma").replace(/δ/g,"delta").replace(/κ/g,"kappa").replace(/λ/g,"lambda");
  s = s.replace(/'s\b/g,"").replace(/^the\s+/,"");
  s = s.replace(/\b(?:factor|f)\s?(xiii|xii|xi|x|ix|viii|vii|vi|v|iv|iii|ii|i)(a?)\b/g,(m,r,a)=>"factor"+ROMAN[r]+a);
  s = s.replace(/\bf\s?(\d{1,2})(a?)\b/g,"factor$1$2");
  return s.replace(/[^a-z0-9]/g,"");
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const d=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
const strip = k => (k.length>4 && k.endsWith("s")) ? k.slice(0,-1) : k;

function buildIndex(item){
  if(item._idx) return item._idx;
  const idx = new Map(), entries=[];
  for(const t of ORDER){
    const list = t==="k" ? [item.a.k] : (item.a[t]||[]);
    for(const raw of list){
      const names = raw.split("|"), e = {tier:t, label:names[0], keys:names.map(norm)};
      entries.push(e);
      for(const k of e.keys){ if(!idx.has(k)) idx.set(k,e); const s=strip(k); if(!idx.has(s)) idx.set(s,e); }
    }
  }
  return item._idx = {idx, entries};
}
function match(item, input){
  const k = norm(input); if(!k) return null;
  const {idx, entries} = buildIndex(item);
  if(idx.has(k)) return idx.get(k);
  if(idx.has(strip(k))) return idx.get(strip(k));
  if(k.length>=6 && !/\d/.test(k)){
    const lim = k.length>=9 ? 2 : 1; let best=null, bd=9, tie=false;
    for(const e of entries) for(const key of e.keys){
      if(key.length<6 || /\d/.test(key)) continue;
      const d = lev(k,key);
      if(d<bd){bd=d;best=e;tie=false} else if(d===bd && best!==e) tie=true;
    }
    if(best && bd<=lim && !tie) return best;
  }
  return null;
}
function nopeNote(item,input){
  if(!item.n) return null; const k=norm(input);
  return item.n[k] || item.n[strip(k)] || null;
}

/* ---------- rng + selection ---------- */
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(pool, n, rand){
  const arr = pool.map((x,i)=>i);
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  const out=[], seen=new Set();
  for(const i of arr){ if(out.length>=n) break; if(!seen.has(pool[i].t)){out.push(i);seen.add(pool[i].t)} }
  for(const i of arr){ if(out.length>=n) break; if(!out.includes(i)) out.push(i) }
  return out;
}
const todayKey = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayNumber = () => Math.floor((new Date(todayKey()) - new Date("2026-10-24"))/864e5)+1;

/* ---------- storage ---------- */
const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- state ---------- */
const TOPICS = [...new Set(BANK.map(b=>b.t))];
let S = null, timerId = null;
const app = document.getElementById("app");
const $ = s => app.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function band(m){
  if(m<1000) return "Shallows";
  if(m<2000) return "Reef";
  if(m<3000) return "Thermocline";
  if(m<4500) return "Twilight Zone";
  if(m<6000) return "Abyss";
  return "Hadal Trench";
}
function setDepth(pts){
  const m = pts*M_PER_PT, max = ROUNDS*100*M_PER_PT;
  document.getElementById("gaugeM").textContent = m.toLocaleString()+" m";
  document.getElementById("gaugeLbl").textContent = m ? band(m) : "at the surface";
  document.getElementById("stripFill").style.width = Math.min(100, m/max*100)+"%";
  document.documentElement.style.setProperty("--depth", Math.min(1, m/(max*0.75)).toFixed(3));
}

/* ---------- screens ---------- */
let chosenTopics = new Set();
function home(){
  clearInterval(timerId); setDepth(0);
  const done = store.get("fos2k-daily-"+todayKey());
  const tierCards = ORDER.slice().reverse().map(t=>`<div class="tier"><b class="c-${t}">${TIERS[t].name}</b><span>${TIERS[t].pts} pts · ${(TIERS[t].pts*M_PER_PT).toLocaleString()} m</span></div>`).join("");
  app.innerHTML = `
  <section class="panel stack">
    <h2>Seven prompts. Twenty-five seconds each.</h2>
    <p>Every prompt has dozens of right answers. The obvious ones barely count; the ones only a careful reader of the lecture would reach for send you deeper. A wrong guess costs nothing but time, so keep typing until the clock runs out.</p>
    <div class="tiers">${tierCards}</div>
    <p class="muted">Too Clever is the "obscure" pick everyone else also thinks of. Each prompt hides exactly one One in a Krillion answer.</p>
  </section>
  <section class="panel stack">
    <div class="roundhead"><h2>Daily Dive</h2><span class="pill">Dive #${dayNumber()} · ${todayKey()}</span></div>
    ${done
      ? `<p>Today's dive: <b>${(done.pts*M_PER_PT).toLocaleString()} m</b>, ${band(done.pts*M_PER_PT)}. A new set surfaces at midnight.</p>
         <div class="row"><button class="ghost" id="viewDaily">See today's results</button></div>`
      : `<p class="muted">Same seven prompts for everyone today, one per block where possible.</p>
         <div class="row"><button class="primary" id="startDaily">Start today's dive</button></div>`}
  </section>
  <section class="panel stack">
    <div class="roundhead"><h2>Unlimited</h2><span class="pill">${BANK.length} prompts in the bank</span></div>
    <p class="muted">Endless practice. Leave every block off to draw from all of them, or pick the blocks you want to drill.</p>
    <div class="chips" id="chips">${TOPICS.map(t=>`<button class="chip ghost" aria-pressed="${chosenTopics.has(t)}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="row"><button class="ghost" id="startFree">Start a practice dive</button></div>
  </section>`;
  $("#chips").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return; const t=b.dataset.t;
    chosenTopics.has(t)?chosenTopics.delete(t):chosenTopics.add(t);
    b.setAttribute("aria-pressed",chosenTopics.has(t));
  });
  const sd=$("#startDaily"); if(sd) sd.onclick=()=>start("daily");
  const vd=$("#viewDaily"); if(vd) vd.onclick=()=>{S=done.state; summary()};
  $("#startFree").onclick=()=>start("free");
}

function start(mode){
  let idxs;
  if(mode==="daily"){ idxs = pick(BANK, ROUNDS, rng(hashStr("fos2-"+todayKey()))); }
  else{
    const pool = BANK.map((b,i)=>({b,i})).filter(x=>!chosenTopics.size || chosenTopics.has(x.b.t));
    const sub = pick(pool.map(x=>x.b), Math.min(ROUNDS,pool.length), Math.random);
    idxs = sub.map(j=>pool[j].i);
  }
  S = {mode, idxs, round:0, pts:0, results:[]};
  round();
}

function round(){
  const item = BANK[S.idxs[S.round]];
  let left = SECONDS, ended = false;
  const guesses = [];
  app.innerHTML = `
  <section class="panel stack">
    <div class="roundhead">
      <span class="pill">${S.mode==="daily"?"Daily":"Unlimited"} · Prompt ${S.round+1} of ${S.idxs.length}</span>
      <span class="pill">${esc(item.t)}</span>
    </div>
    <div class="prompt">${esc(item.q)}</div>
    <div class="row" style="justify-content:space-between"><span class="secs" id="secs">${left}s</span><button class="ghost" id="skip" style="padding:6px 12px;font-size:14px">Give up</button></div>
    <div class="timer" id="timer"><i id="bar"></i></div>
    <form class="answer" id="form" autocomplete="off">
      <label class="sr" for="ans">Your answer</label>
      <input id="ans" type="text" placeholder="Type an answer, press Enter" autocapitalize="off" spellcheck="false">
      <button class="primary" type="submit">Dive</button>
    </form>
    <div class="feedback" id="fb" aria-live="assertive"></div>
  </section>`;
  const inp=$("#ans"), fb=$("#fb"), bar=$("#bar"), secs=$("#secs"), tm=$("#timer");
  inp.focus();
  const t0 = performance.now();
  timerId = setInterval(()=>{
    const el = (performance.now()-t0)/1000; left = Math.max(0, SECONDS-el);
    bar.style.width = (left/SECONDS*100)+"%"; secs.textContent = Math.ceil(left)+"s";
    tm.classList.toggle("low", left<=6);
    if(left<=0) finish(null);
  },100);
  function finish(entry){
    if(ended) return; ended=true; clearInterval(timerId);
    const pts = entry ? TIERS[entry.tier].pts : 0;
    S.pts += pts;
    S.results.push({i:S.idxs[S.round], label: entry?entry.label:null, tier: entry?entry.tier:null, pts, guesses});
    setDepth(S.pts);
    reveal();
  }
  $("#form").onsubmit = e=>{
    e.preventDefault(); if(ended) return;
    const v = inp.value.trim(); if(!v) return;
    const m = match(item, v);
    if(m){ finish(m); return; }
    guesses.push(v);
    const note = nopeNote(item, v);
    fb.className="feedback bad"; fb.textContent = note ? "Not accepted. "+note : `"${v}" isn't in the answer bank. Try another.`;
    inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    inp.select();
  };
  $("#skip").onclick=()=>finish(null);
}

function revealList(item, hit){
  const {entries} = buildIndex(item);
  return ORDER.map(t=>{
    const es = entries.filter(e=>e.tier===t); if(!es.length) return "";
    return `<div class="grp"><h4 class="c-${t}">${TIERS[t].name}<small>${TIERS[t].pts}</small></h4>
      <div class="names">${es.map(e=> e.label===hit ? `<mark>${esc(e.label)}</mark>` : esc(e.label)).join(" · ")}</div></div>`;
  }).join("");
}

function reveal(){
  const r = S.results[S.results.length-1], item = BANK[r.i];
  const last = S.round === S.idxs.length-1;
  app.innerHTML = `
  <section class="panel stack">
    <div class="roundhead">
      <span class="pill">Prompt ${S.round+1} of ${S.idxs.length}</span>
      <span class="pill">${esc(item.t)}</span>
    </div>
    <div class="prompt" style="font-size:24px">${esc(item.q)}</div>
    <div class="result" aria-live="polite">
      ${r.tier
        ? `<span class="badge c-${r.tier} ${r.tier==="k"?"k":""}">${TIERS[r.tier].name}</span>
           <span class="pts"><b>${esc(r.label)}</b> · +${r.pts} pts · +${(r.pts*M_PER_PT).toLocaleString()} m</span>`
        : `<span class="badge" style="color:var(--bad)">No answer</span><span class="pts">+0 m. Here is what was down there.</span>`}
    </div>
    <div class="row"><button class="primary" id="next">${last?"Surface and see results":"Next prompt"}</button></div>
    <div class="reveal">${revealList(item, r.label)}</div>
  </section>`;
  const nb=$("#next"); nb.focus();
  nb.onclick=()=>{ if(last){ endDive() } else { S.round++; round() } };
}

function endDive(){
  if(S.mode==="daily") store.set("fos2k-daily-"+todayKey(), {pts:S.pts, state:S});
  summary();
}

function shareText(){
  const m=S.pts*M_PER_PT;
  const line = S.results.map(r=> r.tier?TIERS[r.tier].emoji:"⚫").join("");
  return `FOS 2 Krillion ${S.mode==="daily"?"#"+dayNumber():"(practice)"}\n${line}\n${m.toLocaleString()} m · ${band(m)}`;
}

function summary(){
  clearInterval(timerId); setDepth(S.pts);
  const m = S.pts*M_PER_PT;
  const rows = S.results.map((r,i)=>{
    const it = BANK[r.i];
    return `<tr><td class="n">${i+1}</td><td>${esc(it.q)}<br><span class="muted">${r.tier?`<span class="c-${r.tier}">${TIERS[r.tier].name}</span> · ${esc(r.label)}`:"No answer"}</span></td><td class="n">${r.pts}</td></tr>`;
  }).join("");
  app.innerHTML = `
  <section class="panel stack">
    <span class="pill" style="align-self:flex-start">${S.mode==="daily"?"Daily Dive #"+dayNumber():"Practice dive"} complete</span>
    <div class="big">${m.toLocaleString()} m</div>
    <div class="band">${band(m)}</div>
    <p class="muted">${S.pts} of ${S.idxs.length*100} points. Seven Rare answers would reach 4,200 m.</p>
    <div style="overflow-x:auto"><table class="sum"><tbody>${rows}</tbody></table></div>
  </section>
  <section class="panel stack">
    <h2>Share</h2>
    <div class="sharebox" id="share">${esc(shareText())}</div>
    <div class="row"><button class="ghost" id="copy">Copy result</button><span class="muted" id="copied" aria-live="polite"></span></div>
  </section>
  <section class="panel stack">
    <h2>Review the bank</h2>
    <p class="muted">Every accepted answer for this dive, by tier. Your pick is highlighted.</p>
    ${S.results.map(r=>`<div class="stack"><b>${esc(BANK[r.i].q)}</b><div class="reveal">${revealList(BANK[r.i], r.label)}</div></div>`).join("")}
  </section>
  <div class="row"><button class="primary" id="again">Practice dive</button><button class="ghost" id="home">Back to start</button></div>`;
  $("#copy").onclick=()=>{
    const t=shareText(), out=$("#copied");
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($("#share"));const s=getSelection();s.removeAllRanges();s.addRange(r);out.textContent="Selected. Press copy on your device."};
    try{ navigator.clipboard.writeText(t).then(()=>out.textContent="Copied.",fallback) }catch(e){ fallback() }
  };
  $("#again").onclick=()=>start("free");
  $("#home").onclick=home;
}

home();
</script>
